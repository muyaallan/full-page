<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme.css" />
<title>Signing you in…</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background:
      radial-gradient(900px 500px at 50% -20%,
        color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.6 var(--font-sans);
  }
  .box { max-width: 440px; padding: 36px 32px; text-align: center; }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 22px;
    border: 3px solid var(--line-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p  { color: var(--muted); margin: 0 0 22px; }
  .ok  { color: var(--success); }
  .err { color: var(--danger); }
  button {
    margin-top: 16px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; padding: 10px 18px; border-radius: var(--r-md);
    cursor: pointer; font-weight: 600;
    transition: background var(--dur-fast) var(--ease);
  }
  button:hover { background: var(--accent-2); }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spin"></div>
    <h1 id="title">Signing you in…</h1>
    <p id="msg">Just a moment.</p>
    <button id="closeBtn" style="display:none">Close this tab</button>
  </div>
  <script src="auth.js"></script>
  <script src="auth-callback.js"></script>
</body>
</html>
